name: Monitor

# Watches the source for new openings and adds them to Supabase.
# Public repo -> Actions minutes are unlimited, so a 10-minute cadence is free.
# GitHub's scheduler is best-effort and can run late under load; the cursor
# means a late run simply picks up everything it missed.

on:
  schedule:
    # Hourly, and deliberately no longer the mechanism. This asked for every 5
    # minutes and GitHub actually delivered every 3 to 6 hours, because it
    # deprioritises frequent cron on free runners. The real poll now runs from
    # pg_cron inside Supabase every minute (db/005-realtime-ingest.sql); this
    # is the safety net for when that is failing and nobody has noticed. The
    # stored cursor means a late run simply collects whatever was missed.
    - cron: '17 * * * *'
  workflow_dispatch:

# The token this workflow gets needs to read the code and nothing else.
# Left unset it can inherit write access to the repository, which a
# compromised dependency running during the job could use.
permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: @supabase/supabase-js needs a native WebSocket, which Node 20 lacks
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Poll for new openings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
          SITE_URL: https://jobmania.dpdns.org
        run: npm run monitor
