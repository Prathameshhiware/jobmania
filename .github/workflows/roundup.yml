name: Weekly roundup

# Publishes the Sunday hiring roundup with nobody present.
#
# Normally fired by pg_cron inside Supabase at 04:30 UTC on Sunday, which is
# 10:00 IST, via workflow_dispatch. That route is used rather than relying on
# the schedule below because GitHub deprioritises scheduled workflows on free
# runners: the five minute monitor cron actually ran every three to six hours.
# A dispatched run is not throttled that way and starts within about a minute.
#
# The schedule is still here as a safety net. If Supabase is down or the token
# expires, the post goes out late rather than not at all, and the generator
# refuses to overwrite a file that already exists so the two cannot collide.

on:
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * 0'   # Sunday, shortly after the pg_cron trigger

concurrency:
  group: roundup
  cancel-in-progress: false

permissions:
  # Needs to write, unlike the other workflows: it commits the generated post.
  contents: write

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: @supabase/supabase-js needs a native WebSocket, which Node 20 lacks
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Generate this week's roundup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run roundup

      - name: Commit it
        run: |
          if [ -z "$(git status --porcelain src/content/insights)" ]; then
            echo "Nothing new to commit. The post for today already exists."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/insights
          git commit -m "Weekly hiring roundup for $(date -u +%d\ %B\ %Y)

          Generated by src/weekly-roundup.js. Headlines, publishers and links
          from Indian newsrooms on the allowlist; every figure counted from the
          jobs table at generation time.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
