name: Expire

# The freshness contract. Retires listings past their deadline and re-tests
# apply links so dead ones leave the site within a day.

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST
  workflow_dispatch:

concurrency:
  group: expire
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - name: Expire and re-check links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHECK_LIMIT: '400'
        run: npm run expire
