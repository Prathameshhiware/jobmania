name: Expire

# The freshness contract. Retires listings past their deadline and re-tests
# apply links so dead ones leave the site within a day.

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST
  workflow_dispatch:

# The token this workflow gets needs to read the code and nothing else.
# Left unset it can inherit write access to the repository, which a
# compromised dependency running during the job could use.
permissions:
  contents: read

concurrency:
  group: expire
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: @supabase/supabase-js needs a native WebSocket, which Node 20 lacks
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Expire and re-check links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
          SITE_URL: https://jobmania.dpdns.org
          CHECK_LIMIT: '400'
        run: npm run expire
